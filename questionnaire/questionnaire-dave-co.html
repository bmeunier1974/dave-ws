  --error: #a3402c;
  --ok: #4f6b3c;
  --scrim: rgb(31 22 19 / 0.45);

}

* { box-sizing: border-box; }
body {

a { color: inherit; }

.lang-btn {

main {
  max-width: 36rem;

}
.eyebrow {

.stack { display: grid; gap: 1rem; margin-top: 1.5rem; }

}

label.field { display: grid; gap: 0.4rem; }
label.field > span { font-size: 0.875rem; font-weight: 600; }
input[type="text"], input[type="tel"], input[type="email"], input[type="url"], input[type="number"], select, textarea {

.error { color: var(--error); font-size: 0.9rem; font-weight: 500; }
.hint { font-size: 0.875rem; color: var(--ink-soft); }

.samples { display: grid; gap: 0.75rem; margin-top: 1.5rem; }

}

  border: 1.5px solid var(--line); border-radius: 50%;
}
.sample[aria-pressed="true"] { border-color: var(--ink); border-width: 2px; }

.editor { display: grid; gap: 0.5rem; padding: 1rem; border-radius: var(--r-m); background: var(--sunk); }
.editor > span { font-size: 0.875rem; font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  min-height: 2.75rem; padding: 0 1rem; cursor: pointer; font-size: 0.98rem;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.add-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
.add-row input { min-width: 0; flex: 1; font-size: 1rem; min-height: 3rem; }

.options { display: grid; gap: 0.75rem; margin-top: 1.5rem; }

.hidden-note {
  margin-top: 1.25rem; padding: 0.9rem 1rem; border-radius: var(--r-s); background: var(--sunk);
  display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.hidden-note p { margin: 0; font-size: 0.95rem; }

.testi { border: 1px solid var(--line); border-radius: var(--r-m); padding: 1rem; display: grid; gap: 0.75rem; background: var(--surface); }
.testi h3 { margin: 0; font-size: 0.8125rem; letter-spacing: 0.08em; text-transform: uppercase; }
.check { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.95rem; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 0.75rem 16px calc(0.75rem + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 36rem; margin: 0 auto; display: grid; gap: 0.5rem; }
.bar-main { display: flex; gap: 0.6rem; }
.btn {

.hello h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); text-transform: uppercase; line-height: 0.98; }

.meta { margin-top: 1.25rem; font-size: 0.95rem; color: var(--ink-soft); }

/* Review */
.group { margin-top: 2rem; }
.group h2 { font: 400 1.5rem/1.1 var(--display); margin: 0 0 0.5rem; }

.row {

.row .k { font-weight: 600; font-size: 0.95rem; }

.pill.must { background: var(--law); color: var(--on-law); }
.summary { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }
.export { margin-top: 2.5rem; padding: 1.25rem; border-radius: var(--r-l); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 0.75rem; }

.send-addr { font-weight: 600; font-size: 1.05rem; user-select: all; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.export .btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }

dialog.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 40rem; max-height: 88vh;

dialog.sheet::backdrop { background: var(--scrim); }

.sheet h3 { margin: 1.4rem 0 0.4rem; font-size: 0.8125rem; letter-spacing: 0.08em; text-transform: uppercase; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.1rem 1fr; gap: 0.6rem; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(s); font: 400 1.35rem/1.2 var(--display); }
.steps li p { margin: 0; }
.steps li .sub { color: var(--ink-soft); font-size: 0.92rem; margin-top: 0.2rem; }
.links { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
.links a { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.8rem 1rem; border-radius: var(--r-s); border: 1px solid var(--line); text-decoration: none; font-weight: 500; }
.links a::after { content: "↗"; }
.sheet-close { margin-top: 1.5rem; width: 100%; }
.grab { width: 3rem; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; }

.toast {

@media (min-width: 48rem) {

@media (prefers-reduced-motion: reduce) {

    return dbRef.get().then(function (snap) {
      var data = snap.exists ? snap.data() : null;
      if (data && data.answers && (data.updatedAt || 0) > (S.updatedAt || 0)) {
        S.answers = JSON.parse(JSON.stringify(data.answers));

/* ---------- Formats and checks ---------- */

function digits(s) { return String(s || "").replace(/\D/g, ""); }
var FMT = {
  phone: function (v) {
    var d = digits(v); if (d.length === 11 && d[0] === "1") d = d.slice(1);
    if (d.length !== 10) return v;
    return d.slice(0, 3) + " " + d.slice(3, 6) + "-" + d.slice(6);
  },
  rbq: function (v) {
    var d = digits(v).slice(0, 10), o = d.slice(0, 4);
    if (d.length > 4) o += "-" + d.slice(4, 8);
    if (d.length > 8) o += "-" + d.slice(8);
    return o;
  },
  postal: function (v) {
    var c = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    return c.length > 3 ? c.slice(0, 3) + " " + c.slice(3) : c;
  },
  neq: function (v) { return digits(v).slice(0, 10); },
  years: function (v) { return digits(v).slice(0, 2); }
};
var CHECK = {
  phone: function (v) { var d = digits(v); return d.length === 10 || (d.length === 11 && d[0] === "1") ? "" : L(UI.invalidPhone); },
  email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "" : L(UI.invalidEmail); },
  postal: function (v) { return /^[A-Z]\d[A-Z] \d[A-Z]\d$/.test(v) ? "" : L(UI.invalidPostal); },
  rbq: function (v) { return digits(v).length === 10 ? "" : L(UI.invalidRbq); },
  neq: function (v) { return digits(v).length === 10 ? "" : L(UI.invalidNeq); },
  years: function (v) { return /^\d{1,2}$/.test(v) ? "" : L(UI.invalidYears); }
};

/* Is the question answered? */
function filled(q) {
  var a = S.answers[q.id];
  if (q.type === "multi" && q.fixed && (!a || a.value == null)) return true; // default: all services
  if (q.def && (!a || a.value == null) && !(a && a.hidden)) return true; // default: prefilled value
  if (!a) return false;
  if (a.hidden) return false;
  var v = a.value;
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  if (q.type === "pick") return !!(a.text && a.text.trim());
  if (q.type === "fields") return !!v && q.fields.some(function (f) { return v[f.k] && String(v[f.k]).trim(); });
  if (q.type === "reviews") return Array.isArray(v) && v.some(function (r) { return r && r.text && r.text.trim(); });
  return v != null && String(v).trim() !== "";
}
function status(q) {
  var a = S.answers[q.id];
  if (a && a.hidden) return "hid";
  if (filled(q)) return "done";
  return q.badge === "law" ? "must" : "todo";
}

/* Problems that block "Continue" (wrong format only; empty is allowed). */
function problems(q) {
  var a = S.answers[q.id] || {}, errs = {};
  if (a.hidden) return errs;
  if (q.type === "text" && q.fmt && CHECK[q.fmt] && a.value && String(a.value).trim()) {
    var e = CHECK[q.fmt](String(a.value)); if (e) errs._ = e;
  }
  if (q.type === "fields") {
    q.fields.forEach(function (f) {
      var v = a.value && a.value[f.k];
      if (f.fmt && v && String(v).trim()) { var e2 = CHECK[f.fmt](String(v)); if (e2) errs[f.k] = e2; }
    });
  }
  if (q.type === "multi" && q.fixed && Array.isArray(a.value) && a.value.length === 0) errs._ = L(UI.needOneService);
  return errs;
}

      } else {
        ctl = textInput({ id: "f-" + q.id + "-" + f.k, input: f.input, fmt: f.fmt, placeholder: f.placeholder, auto: f.auto,
          value: a.value[f.k], errId: "err-" + f.k, describedBy: "err-" + f.k,
          onChange: function (v) { a.value[f.k] = v; save(); refreshNext(); } });
      }
      var kids = [h("span", { text: L(f.label) }), ctl, h("span", { class: "error", id: "err-" + f.k })];
      if (f.fillFrom && S.answers[f.fillFrom] && S.answers[f.fillFrom].value) {
        var src = S.answers[f.fillFrom].value;
        kids.push(h("button", { class: "linkish", type: "button", style: "justify-self:start",
          text: L(UI.useMyEmail) + " (" + src + ")",
          onclick: function () { ctl.value = src; a.value[f.k] = src; save(); refreshNext(); } }));
      }
      return h("label", { class: "field" }, kids);
    }));
  },

  pick: function (q, a) {
    var wrap = h("div", { class: "samples", role: "group", "aria-labelledby": "q-title" });
    var editorHost = h("div");
    function draw() {
      wrap.innerHTML = "";
      q.samples.forEach(function (s, i) {
        var on = a.choice === i;
        wrap.appendChild(h("button", { class: "sample", type: "button", "aria-pressed": on ? "true" : "false",
          onclick: function () {
            a.choice = i; a.text = L(s); a.lang = S.lang; a.edited = false;
            a.fr = s.fr; a.en = s.en;
            save(); draw(); refreshNext();
          } }, [h("small", { text: L(UI.sampleTag) + " " + (i + 1) }), L(s)]));
      });
      wrap.appendChild(h("button", { class: "sample custom", type: "button", "aria-pressed": a.choice === "custom" ? "true" : "false",
        onclick: function () { if (a.choice !== "custom") { a.choice = "custom"; a.text = a.text || ""; a.edited = true; a.lang = S.lang; a.fr = a.en = null; } save(); draw(); refreshNext(); var t = document.getElementById("edit-" + q.id); if (t) t.focus(); } },
        [L(UI.customCard)]));
      drawEditor();
    }
    function drawEditor() {
      editorHost.innerHTML = "";
      if (a.choice == null) return;
      var ta = h("textarea", { id: "edit-" + q.id, rows: q.short ? 2 : 4 });
      if (q.short) ta.style.minHeight = "4.5rem";
      ta.value = a.text || "";
      var note = h("span", { class: "hint", text: a.edited ? L(UI.translateNote) : L(UI.sampleNote) });
      ta.addEventListener("input", function () {
        a.text = ta.value; a.lang = S.lang;
        var s = typeof a.choice === "number" ? q.samples[a.choice] : null;
        a.edited = !s || ta.value !== L(s);
        if (a.edited) { a.fr = a.en = null; } else { a.fr = s.fr; a.en = s.en; }
        note.textContent = a.edited ? L(UI.translateNote) : L(UI.sampleNote);
        save(); refreshNext();
      });
      editorHost.appendChild(h("label", { class: "editor" }, [
        h("span", { text: a.choice === "custom" ? L(UI.customLabel) : L(UI.editLabel) }), ta, note
      ]));
    }
    draw();
    return h("div", { class: "stack" }, [wrap, editorHost]);
  },

  multi: function (q, a) {
    if (q.fixed && !Array.isArray(a.value)) a.value = q.options.slice();
    if (!Array.isArray(a.value)) a.value = [];
    var wrap = h("div", { class: "chips", role: "group", "aria-labelledby": "q-title" });
    var opts = q.options.slice();
    a.value.forEach(function (v) { if (opts.indexOf(v) === -1) opts.push(v); });
    function name(v) {
      if (q.fixed) { var s = SERVICES.filter(function (x) { return x.id === v; })[0]; return s ? L(s) : v; }
      return v;
    }
    function draw() {
      wrap.innerHTML = "";
      opts.forEach(function (v) {
        var on = a.value.indexOf(v) !== -1;
        wrap.appendChild(h("button", { class: "chip", type: "button", "aria-pressed": on ? "true" : "false", text: (on ? "✓ " : "") + name(v),
          onclick: function () {
            if (on) a.value = a.value.filter(function (x) { return x !== v; }); else a.value.push(v);
            save(); draw(); refreshNext(); document.getElementById("q-error").textContent = "";
          } }));
      });
    }
    draw();
    var kids = [wrap];
    if (q.addable) {
      var inp = h("input", { type: "text", id: "add-" + q.id, placeholder: L(UI.addCity), autocomplete: "off", "aria-label": L(UI.addCity) });
      function add() {
        var v = inp.value.trim(); if (!v) return;
        if (opts.indexOf(v) === -1) opts.push(v);
        if (a.value.indexOf(v) === -1) a.value.push(v);
        inp.value = ""; save(); draw(); refreshNext();
      }
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); add(); } });
      kids.push(h("div", { class: "add-row" }, [inp, h("button", { class: "btn quiet", type: "button", text: L(UI.add), onclick: add })]));
    }
    return h("div", null, kids);
  },

  choice: function (q, a) {
    var wrap = h("div", { class: "options", role: "radiogroup", "aria-labelledby": "q-title" });
    var extraHost = h("div");
    function draw() {
      wrap.innerHTML = "";
      q.choices.forEach(function (c) {
        var on = a.value === c.v;
        wrap.appendChild(h("button", { class: "sample", type: "button", role: "radio", "aria-checked": on ? "true" : "false", "aria-pressed": on ? "true" : "false", text: L(c),
          onclick: function () { a.value = c.v; save(); draw(); refreshNext(); } }));
      });
      extraHost.innerHTML = "";
      if (q.extra && a.value === q.extra.when) {
        a.extra = a.extra || {};
        extraHost.appendChild(h("label", { class: "field" }, [
          h("span", { text: L(q.extra.label) }),
          textInput({ id: "f-" + q.id + "-extra", value: a.extra[q.extra.k], onChange: function (v) { a.extra[q.extra.k] = v; save(); } })
        ]));
      }
    }
    draw();
    return h("div", { class: "stack" }, [wrap, extraHost]);
  },

  reviews: function (q, a) {
    if (!Array.isArray(a.value)) a.value = [{}, {}, {}];
    var tpl = S.lang === "fr"
      ? "Bonjour [prénom], merci encore de nous avoir confié vos travaux. Accepteriez-vous qu'on publie quelques mots de votre part sur notre site web, avec votre prénom et votre ville ? Deux ou trois phrases suffisent. Merci ! Dave"
      : "Hi [first name], thanks again for trusting us with your project. Would you let us post a few words from you on our website, with your first name and city? Two or three sentences is plenty. Thank you! Dave";
    var kids = a.value.map(function (r, i) {
      return h("div", { class: "testi" }, [
        h("h3", { text: (S.lang === "fr" ? "Commentaire " : "Comment ") + (i + 1) }),
        h("label", { class: "field" }, [h("span", { text: S.lang === "fr" ? "Ce que le client a dit" : "What the client said" }),
          (function () { var t = h("textarea", { id: "rev-" + i + "-text", rows: 3 }); t.value = r.text || "";
            t.addEventListener("input", function () { r.text = t.value; save(); refreshNext(); }); return t; })()]),
        h("label", { class: "field" }, [h("span", { text: S.lang === "fr" ? "Prénom et ville" : "First name and city" }),
          textInput({ id: "rev-" + i + "-who", placeholder: S.lang === "fr" ? "Julie, Brossard" : "Julie, Brossard", value: r.who, onChange: function (v) { r.who = v; save(); } })]),
        h("label", { class: "check" }, [
          (function () { var c = h("input", { type: "checkbox", id: "rev-" + i + "-ok" }); c.checked = !!r.ok;
            c.addEventListener("change", function () { r.ok = c.checked; save(); }); return c; })(),
          h("span", { text: S.lang === "fr" ? "Le client m'a donné la permission de le publier." : "The client gave me permission to post it." })
        ])
      ]);
    });
    var tplBox = h("textarea", { id: "rev-template", rows: 5, readonly: true });
    tplBox.value = tpl;
    kids.unshift(h("div", { class: "editor" }, [
      h("span", { text: S.lang === "fr" ? "Message à envoyer à un client pour demander un commentaire" : "Message to send a client to ask for a comment" }),
      tplBox,
      h("button", { class: "btn quiet", type: "button", text: S.lang === "fr" ? "Copier le message" : "Copy the message",
        onclick: function () { copyText(tpl, tplBox, S.lang === "fr" ? "Message copié" : "Message copied"); } })
    ]));
    return h("div", { class: "stack" }, kids);
  }
};

/* ---------- Guide sheet ---------- */

var sheet = document.getElementById("sheet");
function openGuide(key) {
  var g = GUIDES[key], b = document.getElementById("sheet-body");
  b.innerHTML = "";
  b.appendChild(h("div", { class: "grab", "aria-hidden": "true" }));
  b.appendChild(h("p", { class: "eyebrow", style: "margin-top:1rem", text: L(UI.guideTitle) }));
  b.appendChild(h("h2", { id: "sheet-title", text: L(g.title) }));
  b.appendChild(h("p", { class: "why" }, [h("strong", { text: L(UI.why) + ". " }), L(g.why)]));
  b.appendChild(h("p", { class: "help", text: L(g.have) }));
  b.appendChild(h("h3", { text: L(UI.stepsH) }));
  b.appendChild(h("ol", { class: "steps" }, g.steps.map(function (s) {
    var t = s[S.lang] || s.fr;
    return h("li", null, [h("div", null, [h("p", { text: t[0] }), t[1] ? h("p", { class: "sub", text: t[1] }) : null])]);
  })));
  b.appendChild(h("h3", { text: L(UI.linksH) }));
  b.appendChild(h("div", { class: "links" }, g.links.map(function (l) {
    return h("a", { href: l.url, target: "_blank", rel: "noopener" }, [h("span", { text: L(l) })]);
  })));
  b.appendChild(h("button", { class: "btn primary sheet-close", type: "button", text: L(UI.guideClose), onclick: function () { sheet.close(); } }));
  if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", "");
  b.scrollTop = 0;
}
sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.close(); });

/* ---------- Review and export ---------- */

function valueText(q, lang) {
  var a = S.answers[q.id] || {};
  var LL = function (o) { return o == null ? "" : typeof o === "string" ? o : o[lang] || o.fr; };
  if (a.hidden) return lang === "fr" ? "(masqué pour l'instant)" : "(hidden for now)";
  if (!filled(q)) return "";
  var v = a.value != null ? a.value : q.def;
  switch (q.type) {
    case "multi": {
      var list = Array.isArray(v) ? v : q.options;
      return list.map(function (x) {
        if (!q.fixed) return x;
        var s = SERVICES.filter(function (y) { return y.id === x; })[0]; return s ? LL(s) : x;
      }).join(", ");
    }
    case "pick": return a.edited ? a.text : LL({ fr: a.fr, en: a.en }) || a.text;
    case "fields": return q.fields.map(function (f) { return v[f.k] ? LL(f.label) + " : " + v[f.k] : null; }).filter(Boolean).join("\n");
    case "choice": {
      var c = q.choices.filter(function (x) { return x.v === v; })[0];
      var t = c ? LL(c) : v;
      if (q.extra && a.extra && a.extra[q.extra.k]) t += "\n" + LL(q.extra.label) + " : " + a.extra[q.extra.k];
      return t;
    }
    case "reviews": return v.filter(function (r) { return r.text && r.text.trim(); }).map(function (r) {
      return "« " + r.text.trim() + " » " + (r.who || "") + (r.ok ? "" : (lang === "fr" ? " [permission à confirmer]" : " [permission to confirm]"));
    }).join("\n");
    default: return String(v);
  }
}

function exportText() {
  var lines = ["DAVE & CO — " + (S.lang === "fr" ? "Réponses du questionnaire" : "Questionnaire answers"),
    (S.lang === "fr" ? "À envoyer à : " : "Send to: ") + SEND_TO,
    new Date(S.updatedAt || Date.now()).toLocaleString(S.lang === "fr" ? "fr-CA" : "en-CA"), ""];
  var vis = visible(), last = null;
  vis.forEach(function (q) {
    if (q.section !== last) { lines.push("", "## " + L(SECTIONS[q.section])); last = q.section; }
    var v = valueText(q, S.lang);
    lines.push("- " + L(q.label));
    lines.push("  " + (v ? v.replace(/\n/g, "\n  ") : "[" + L(UI.empty) + "]"));
    var a = S.answers[q.id];
    if (q.type === "pick" && a && a.edited && a.text) lines.push("  " + (S.lang === "fr" ? "(texte personnalisé, à traduire)" : "(custom text, to translate)"));
  });
  return lines.join("\n");
}
function exportJson() {
  var out = { app: "daveco-questionnaire", version: 1, updatedAt: S.updatedAt, answers: {} };
  visible().forEach(function (q) {
    var a = S.answers[q.id] || {};
    out.answers[q.id] = { status: status(q), fr: valueText(q, "fr"), en: valueText(q, "en"), raw: a };
  });
  return JSON.stringify(out, null, 2);
}

function copyText(text, box, okMsg) {
  function fallback() { if (box) { box.focus(); box.select(); } toast(L(UI.copyFail)); }
  try {
    navigator.clipboard.writeText(text).then(function () { toast(okMsg || L(UI.copied)); }, fallback);
  } catch (e) { fallback(); }
}

function renderReview(vis) {
  var counts = { done: 0, hid: 0, todo: 0, must: 0 };
  vis.forEach(function (q) { counts[status(q)]++; });
  var screen = h("section", { class: "screen" }, [
    h("p", { class: "eyebrow", text: S.lang === "fr" ? "Résumé" : "Summary" }),
    h("h1", { text: S.lang === "fr" ? "Vos réponses" : "Your answers" }),
    h("p", { class: "help", text: S.lang === "fr"
      ? "Touchez une ligne pour la modifier. Les réponses sont enregistrées."
      : "Tap a row to change it. Your answers are saved." }),
    h("div", { class: "summary" }, [
      h("span", { class: "pill done", text: counts.done + " " + L(UI.done) }),
      counts.hid ? h("span", { class: "pill hid", text: counts.hid + " " + L(UI.hidden) }) : null,
      counts.todo ? h("span", { class: "pill todo", text: counts.todo + " " + L(UI.todo) }) : null,
      counts.must ? h("span", { class: "pill must", text: counts.must + " " + L(UI.must) }) : null
    ])
  ]);
  var last = null, list = null;
  vis.forEach(function (q, i) {
    if (q.section !== last) {
      last = q.section; list = h("ul", { class: "rows" });
      screen.appendChild(h("div", { class: "group" }, [h("h2", { text: L(SECTIONS[q.section]) }), list]));
    }
    var st = status(q), v = valueText(q, S.lang);
    var pillTxt = { done: UI.done, hid: UI.hidden, todo: UI.todo, must: UI.must }[st];
    list.appendChild(h("li", null, [h("button", { class: "row", type: "button",
      onclick: function () { fromReview = true; S.pos = i; save(); render(); scrollTop(); } }, [
      h("span", { class: "k", text: L(q.label) }),
      h("span", { class: "pill " + st, text: L(pillTxt) }),
      h("span", { class: "v", text: v || L(UI.empty) })
    ])]));
  });

  var txt = exportText();
  var box = h("textarea", { id: "export-text", readonly: true, rows: 8 });
  box.value = txt;
  var btns = h("div", { class: "btns" }, [
    h("button", { class: "btn primary", type: "button", text: S.lang === "fr" ? "Copier les réponses" : "Copy the answers",
      onclick: function () { copyText(exportText(), box); } })
  ]);
  if (downloads) {
    btns.appendChild(h("button", { class: "btn quiet", type: "button", text: S.lang === "fr" ? "Enregistrer un fichier" : "Save a file",
      onclick: function () { downloads.save({ filename: "dave-co-reponses.json", data: exportJson() }).catch(function () {}); } }));
  }
  screen.appendChild(h("div", { class: "export" }, [
    h("h2", { text: S.lang === "fr" ? "Envoyer vos réponses" : "Send your answers" }),
    h("p", { text: cloudOk
      ? (S.lang === "fr" ? "Vos réponses sont déjà enregistrées en ligne. Vous pouvez aussi les copier et les envoyer par courriel." : "Your answers are already saved online. You can also copy them and send them by email.")
      : (S.lang === "fr" ? "1. Touchez « Copier les réponses ». 2. Collez-les dans un courriel. 3. Envoyez le courriel à cette adresse :" : "1. Tap \u201cCopy the answers\u201d. 2. Paste them in an email. 3. Send the email to this address:") }),
    h("div", { class: "send-to" }, [
      h("span", { class: "send-addr", text: SEND_TO }),
      h("button", { class: "btn quiet", type: "button", text: S.lang === "fr" ? "Copier l'adresse" : "Copy address",
        onclick: function (e) { copyText(SEND_TO, null, S.lang === "fr" ? "Adresse copiée" : "Address copied"); } })
    ]),
    box, btns
  ]));
  main.appendChild(screen);

  var inner = h("div", { class: "bar-inner" }, [h("div", { class: "bar-main" }, [
    h("button", { class: "btn icon quiet", type: "button", "aria-label": L(UI.back), html: ICON.back,
      onclick: function () { S.pos = visible().length - 1; save(); render(); scrollTop(); } }),
    h("button", { class: "btn primary", type: "button", text: S.lang === "fr" ? "Copier les réponses" : "Copy the answers",
      onclick: function () { copyText(exportText(), box); } })
  ])]);
  bar.appendChild(inner);
}

/* ---------- Start ---------- */

document.getElementById("lang-btn").addEventListener("click", function () {
  S.lang = S.lang === "fr" ? "en" : "fr";
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  render();
});

loadLocal();
if (S.pos >= 0 || S.pos === -2) { /* resume on the same screen */ } else { S.pos = -1; }
render();
connect();
})();
</script>
